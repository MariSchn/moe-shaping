output_dir: "./outputs/fixed-imbalanced-target"
seed: 0

target:
  type: model  # "piecewise_linear" or "model"
  domain: [-1, 1]
  kwargs:
    num_experts: 4
    input_dim: 1
    output_dim: 1
    router_top_k: 2
    router_activation: softmax
    expert_hidden_dim: null
    expert_num_layers: 1
    initial_expert_weights:
      - [[0.0]]
      - [[0.3]]
      - [[2.0]]
      - [[2.0]]
    initial_expert_biases:
      - [0.0]
      - [1.0]
      - [8.0]
      - [-8.0]
    initial_gating_weights:
      - [0.0]
      - [0.0]
      - [1.0]
      - [-1.0]
    initial_gating_biases:
      - 3.0
      - 2.9
      - 2.0
      - 2.0

model:
  num_experts: 4
  input_dim: 1
  output_dim: 1
  router_top_k: 2
  router_activation: softmax
  # "linear" or "bandit" (contextual rising bandit, see router.BanditRouter).
  router_type: linear
  # Only used by the bandit router.
  bandit_router:
    # Window h = floor(epsilon * pulls) of the estimator, epsilon in (0, 1/2).
    epsilon: 0.25
    # Noise scale of the exploration bonus.
    sigma: 0.1
    # Confidence delta_t = t^-alpha of the exploration bonus, alpha > 2.
    alpha: 3.0
    # Learning rate of the reward model.
    lr: 0.01
    # Weight of LinUCB's covariance term in the index, off while 0.
    linucb_weight: 0.0
    # Ridge of the design matrices of the covariance term.
    linucb_ridge: 1.0
  expert_hidden_dim: null
  expert_num_layers: 1
  freeze_router: false
  freeze_experts: false

training:
  num_steps: 5000
  batch_size: 128
  learning_rate: 1e-2
  # One of: SGD, Adam, AdamW
  optimizer: Adam
  # Controls the weight of the Switch Transformer-style load balancing loss (1e-2 default from paper).
  load_balancing_loss_weight: 0.0
  # DeepSeek V3 auxiliary loss-free load balancing gamma, controlling how much is added/subtracted to under/over-utilized experts (1e-3 default from paper)
  auxiliarly_loss_free_load_balancing_gamma: 0.0
  # LOLA shaping. Each direction is off while its weight is 0.
  lola:
    # Router-Router LOLA shaping weight.
    router_router_weight: 0.0
    # Which selected expert(s) act as LOLA learners (shaped to anticipate the
    # naive learners' update): "top1" / "bottom1" pick one per sample; "all"
    # makes every selected expert a LOLA learner shaping the others; "fixed:N"
    # pins expert N as the sole LOLA learner (samples where N isn't selected
    # contribute zero correction).
    router_router_learner: all
    # Expert-Expert LOLA shaping weight.
    expert_expert_weight: 0.0
    # Which selected expert(s) act as LOLA learners for expert-expert shaping:
    # "top1" / "bottom1" / "all" / "fixed:N".
    expert_expert_learner: all
  bilevel:
    router_steps: 0
    router_lr: null
    expert_steps: 0
    expert_lr: null



logging:
  anim_sampling_rate: 50

wandb:
  enabled: true
  project: moe-shaping
  entity: mari-schn
  run_name: Imbalanced Target
  run_tags: []
