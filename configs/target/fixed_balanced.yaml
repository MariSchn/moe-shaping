# Roughly balanced (top-2 loads 0.37/0.63): expert e leads on the e-th quarter of
# [-1, 1], steep lines at the ends and plateaus at -1 and 1 in the middle. Without load
# balancing the router tends to collapse onto two experts that fit one straight line.
defaults:
  - random_model
  - _self_

model:
  dims: [1, 1]
  initial_parameters:
    layers.0.experts.weights.0: [[[12.0]], [[0.0]], [[0.0]], [[12.0]]]
    layers.0.experts.biases.0: [[4.0], [-1.0], [1.0], [-4.0]]
    layers.0.router.scorer.0.weight: [[-12.0], [-4.0], [4.0], [12.0]]
    layers.0.router.scorer.0.bias: [-4.5, -0.5, -0.5, -4.5]
