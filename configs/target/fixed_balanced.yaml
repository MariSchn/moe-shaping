# Roughly balanced (top-2 loads 0.36/0.64), odd: the outer experts y = -5x +- 5 lead
# toward the ends and the two inner experts, both y = x, in the middle, with jumps at
# x = +-0.28 where the outer experts leave the top-2. Without load balancing the router
# collapses onto two experts that fit one straight line.
defaults:
  - random_model
  - _self_

model:
  dims: [1, 1]
  initial_parameters:
    layers.0.experts.weights.0: [[[-5.0]], [[1.0]], [[1.0]], [[-5.0]]]
    layers.0.experts.biases.0: [[5.0], [0.0], [0.0], [-5.0]]
    layers.0.router.scorer.0.weight: [[-13.0], [-1.5], [1.5], [13.0]]
    layers.0.router.scorer.0.bias: [-4.0, 0.0, 0.0, -4.0]
