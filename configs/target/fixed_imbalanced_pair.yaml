# Imbalanced: experts 0 and 1 serve every input, y = 2x - 8 + 16 sigmoid(12x), and the
# zero experts 2 and 3 sit just below the pair's lowest score, so they are never selected.
# Load balancing pushes experts 2 and 3 into use, which turns the step into a jagged
# staircase and drives target_mse up after a few thousand steps. This relies on
# gamma >= 1e-3 and the default 5000 steps.
defaults:
  - random_model
  - _self_

model:
  dims: [1, 1]
  initial_parameters:
    layers.0.experts.weights.0: [[[2.0]], [[2.0]], [[0.0]], [[0.0]]]
    layers.0.experts.biases.0: [[-8.0], [8.0], [0.0], [0.0]]
    layers.0.router.scorer.0.weight: [[-6.0], [6.0], [0.0], [0.0]]
    layers.0.router.scorer.0.bias: [0.0, 0.0, -7.0, -7.0]
