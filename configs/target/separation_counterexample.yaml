# A target a regular top-2 MoE cannot represent (train with model.num_experts=3). The
# experts are the constants (2, 0, -2); experts 0 and 1 are selected for x < 0 and
# experts 1 and 2 for x > 0, weighted by the softmax of s(x) = (20 (x + 1/2), 0,
# -20 (x - 1/2)), i.e. by the pair logits s_i - s_j: 20 x + 10, 40 x, 20 x - 10. The
# output rises from 0 to 2 around x = -1/2, jumps to -2 at 0 and rises back to 0 around
# x = 1/2. Expert 1 carries the majority weight at both ends, which a regular MoE
# cannot do: there the expert with the majority weight has the highest router score,
# and linear scores make each expert highest on one interval only.
_target_: targets.ModelTarget
_convert_: all
domain: [-1, 1]
model:
  _target_: model.moe.Model
  _convert_: all
  dims: [1, 1]
  num_experts: 3
  top_k: 2
  router:
    _target_: model.router.SeparatedRouter
    _partial_: true
  initial_parameters:
    layers.0.experts.weights.0: [[[0.0]], [[0.0]], [[0.0]]]
    layers.0.experts.biases.0: [[2.0], [0.0], [-2.0]]
    # Selection scores (-x, 10, x): drop expert 2 for x < 0 and expert 0 for x > 0.
    layers.0.router.selector.0.weight: [[-1.0], [0.0], [1.0]]
    layers.0.router.selector.0.bias: [0.0, 10.0, 0.0]
    # Logits of the pairs (0, 1), (0, 2), (1, 2), each weighting its first expert.
    layers.0.router.gate.0.weight: [[20.0], [40.0], [20.0]]
    layers.0.router.gate.0.bias: [10.0, 0.0, -10.0]
