# A background expert 0, y = 6x, is always selected, with a weight sigmoid(1.5x - 1.5)
# rising from 0.05 to 0.5, next to one of the specialists y = 1.5, y = -1.5 and
# y = 0.5 + x, which take over at x = -1/3 and x = 1/3. Joint routing can't represent
# this exactly with any continuous router and any number of experts: the selection
# can only switch between experts tied for the k-th score, i.e. with the smallest
# weight, but here the leaving specialist outweighs the background expert.
_target_: targets.ModelTarget
_convert_: all
domain: [-1, 1]
model:
  _target_: model.moe.Model
  _convert_: all
  dims: [1, 1]
  num_experts: 4
  top_k: 2
  router:
    _target_: model.router.SplitRouter
    _partial_: true
  initial_parameters:
    layers.0.experts.weights.0: [[[6.0]], [[0.0]], [[0.0]], [[1.0]]]
    layers.0.experts.biases.0: [[0.0], [1.5], [-1.5], [0.5]]
    layers.0.router.selector.0.weight: [[0.0], [-10.0], [0.0], [10.0]]
    layers.0.router.selector.0.bias: [10.0, -3.333333, 0.0, -3.333333]
    layers.0.router.scorer.0.weight: [[0.0], [-1.5], [-1.5], [-1.5]]
    layers.0.router.scorer.0.bias: [0.0, 1.5, 1.5, 1.5]
