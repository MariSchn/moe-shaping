name: load-balancing-loss
project: moe-shaping
entity: mari-schn

method: grid
metric:
  name: loss
  goal: minimize

program: src/main.py
command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}

parameters:
  target:
    value: fixed
  optimizer.lr:
    values: [1e-4, 1e-3, 1e-2]
  training.load_balancing_loss_weight:
    values: [1e-3, 1e-2, 1e-1]
