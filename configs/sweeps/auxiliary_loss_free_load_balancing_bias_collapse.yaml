name: auxiliary-loss-free-load-balancing-bias-collapse
project: moe-shaping
entity: mari-schn

method: grid
metric:
  name: final_router_bias_std
  goal: minimize

program: src/main.py
command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}

parameters:
  router:
    value: load_balancing
  optimizer:
    values: [sgd, adam]
  model.num_experts:
    values: [4, 16]
  model.top_k:
    values: [2, 4, 8]
  model.dims:
    values: [[1, 1], [16, 1]]
  router.gamma:
    values: [1e-3, 1e-2]
