name: auxiliary-loss-free-load-balancing
project: moe-shaping
entity: mari-schn

method: grid
metric:
  name: loss
  goal: minimize

program: src/main.py
command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}

parameters:
  target:
    value: fixed
  router:
    value: load_balancing
  optimizer.lr:
    values: [1e-4, 1e-3, 1e-2]
  router.gamma:
    values: [1e-4, 1e-3, 1e-2]
